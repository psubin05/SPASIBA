# 로컬 개발·시연용: MQTT 브로커 + PostgreSQL + API 서버
# 실행: cp .env.example .env && docker compose up --build
services:
  broker:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: spasiba
      POSTGRES_PASSWORD: spasiba
      POSTGRES_DB: spasiba
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spasiba"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - crops:/srv/crops
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started

volumes:
  mosquitto-data:
  pg-data:
  crops:
